services:
  - type: web
    name: obc-whatsapp-asistan-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node bot-baileys.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
