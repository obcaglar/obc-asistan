services:
  - type: web
    name: obc-whatsapp-asistan-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node bot-baileys.js
    envVars:
      - key: ASSISTANT_API_URL
        value: https://obc-asistan.vercel.app/api/assistant
      - key: VERCEL_API_URL
        value: https://obc-asistan.vercel.app/api/assistant
      - key: WHATSAPP_ASSISTANT_NUMBER
        value: "+905491007729"
